name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend check && pnpm --dir frontend build
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: docker build -t einblick:test .
      - run: docker run --rm --entrypoint journalctl einblick:test --version
      - name: Prepare isolated kernel tests
        run: |
          rustup toolchain install nightly-2026-10-12 --profile minimal --component rust-src
          mkdir -p /tmp/einblick-ci-tools
          curl -fL https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst -o /tmp/einblick-bpf-linker.tar.zst
          tar --zstd -xf /tmp/einblick-bpf-linker.tar.zst -C /tmp/einblick-ci-tools
          PATH="/tmp/einblick-ci-tools:$PATH" ./scripts/prepare-kernel-tests.sh
      - name: Verify XDP in isolated namespace
        run: sudo unshare --net -- ./scripts/test-kernel.sh
      - name: Mock HTTP smoke test
        run: EINBLICK_TEST_BINARY="$PWD/target/release/einblick" python3 scripts/smoke-test.py
      - name: Service protection HTTP smoke test
        run: EINBLICK_TEST_BINARY="$PWD/target/release/einblick" python3 scripts/service-smoke-test.py
      - name: Caddy attribution HTTP smoke test
        run: EINBLICK_TEST_BINARY="$PWD/target/release/einblick" python3 scripts/caddy-smoke-test.py
