# Copy to einblick.toml and set your actual interface and public origin.
bind = "127.0.0.1:9080"
public_origin = "https://einblick.example.com"
trusted_proxies = ["127.0.0.1/32", "::1/128"]
interfaces = ["eth0"]
generic_fallback = true
mock = false
secure_cookies = true
database = "/data/einblick.sqlite"
password_file = "/run/secrets/admin-password"
source_capacity = 4096
port_capacity = 4096
# Per-bank association slots; both port and association banks rotate each poll.
association_capacity = 4096
# Distinct associations per minute, including low-volume sources.
detail_minute_capacity = 16384
# Combined minute/hour detail rows; oldest buckets expire at this bound.
detail_row_limit = 1000000
ring_bytes = 1048576
# Protect your actual administrator / VPN address before enabling automatic bans.
management_allowlist = []

[ip_enrichment]
# Public DB-IP Lite country/ASN downloads; no account or API token required.
# Enabled by default for live capture. Mock mode never downloads databases.
enabled = true
# Empty stores MMDB files in ip-enrichment/ beside the history database.
directory = ""
# Check daily for monthly releases; keep cached data when updates fail.
check_seconds = 86400

[applications]
enabled = true
proc_root = "/host/proc"
refresh_seconds = 2
stale_seconds = 10
# Serialized application evidence beyond the per-row status allowance, per batch.
batch_evidence_bytes = 8388608
# Optional: mount the Docker daemon socket and set its path for automatic
# container names, published ports, and outbound NAT flows (including kernel
# WireGuard). A :ro socket mount still grants API access.
docker_socket = ""
# Service labels also work without automatic discovery. Protocol 6=TCP, 17=UDP.
# [[applications.services]]
# name = "My web service"
# destination = "192.0.2.1/32"
# protocol = 6
# port = 443

[detection]
scan_ports = 25
syns_10s = 1000
flood_pps = 20000
repeated_syns_60s = 300
repeated_auto_ban = false
ban_seconds = 600

[retention]
minute_days = 7
hourly_days = 90
event_days = 90
