services:
  einblick:
    build: .
    image: einblick:local
    platform: linux/amd64
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    # PERFMON permits the verifier's packet-pointer arithmetic on Linux 6.1+.
    # Application collector reads host socket owners; the HTTP parent drops
    # SYS_PTRACE/DAC_READ_SEARCH before starting runtime threads.
    cap_add: [BPF, NET_ADMIN, PERFMON, SYS_PTRACE, DAC_READ_SEARCH]
    # Docker's default seccomp profile may reject bpf(); capabilities still apply.
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - einblick-data:/data
      - ./einblick.toml:/etc/einblick.toml:ro
      - /proc:/host/proc:ro
      # Optional Docker published-port/NAT attribution. Also set
      # applications.docker_socket = "/var/run/docker.sock" in einblick.toml.
      # A :ro socket mount still grants Docker daemon API access.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - source: admin-password
        target: admin-password
    environment:
      RUST_LOG: einblick=info
      EINBLICK_HEALTH_ADDRESS: 127.0.0.1:9080
    healthcheck:
      test: [CMD, /usr/local/bin/einblick, --healthcheck]
      interval: 15s
      timeout: 4s
      start_period: 10s
    stop_grace_period: 10s
    # Userspace target (256 MiB) plus separate kernel-map budget (64 MiB).
    mem_limit: 320m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  einblick-data:
secrets:
  admin-password:
    file: ./secrets/admin-password
