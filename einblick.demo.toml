# Local Docker preview: synthetic traffic, no host packet capture or enforcement.
bind = "0.0.0.0:9080"
public_origin = "http://127.0.0.1:9080"
mock = true
secure_cookies = false
database = "/data/einblick.sqlite"
password_file = "/run/secrets/admin-password"
management_allowlist = ["192.0.2.24/32"]

[[applications.services]]
name = "Demo HTTPS service"
destination = "192.0.2.1/32"
protocol = 6
port = 443

[[applications.services]]
name = "Demo SSH service"
destination = "2001:db8::1/128"
protocol = 6
port = 22
