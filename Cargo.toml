[workspace]
members = ["crates/common", "crates/core", "crates/server"]
exclude = ["crates/ebpf"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
